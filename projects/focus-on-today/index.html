<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus On Today</title>

    <link rel="stylesheet" href="style.css">
    <script src="first.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1 class="title">
            Focus on <span>Today</span>
        </h1>

        <div class="app-container">

            <h2 class="subtitle">
                Today
                <img src="images/Sun.svg" alt="Sun Icon" class="sun-icon">
            </h2>

            <p class="progress-label">
                Raise the bar by completing your goals!
            </p>

            <div class="progress-bar">
                <div class="progress-value">
                    0/3 Completed
                </div>
            </div>

            <p class="error-label">
                Please set all 3 goals!
            </p>

            <div class="goal-container">
                <div class="manual-checkbox">
                    <img class="check-icon" src="./images/Group 1.svg" alt="Check">
                </div>

                <input class="goal-input" type="text" placeholder="Add a New Goal">
            </div>

            <div class="goal-container">
                <div class="manual-checkbox">
                    <img class="check-icon" src="./images/Group 1.svg" alt="Check">
                </div>

                <input class="goal-input" type="text" placeholder="Add a New Goal">
            </div>

            <div class="goal-container">
                <div class="manual-checkbox">
                    <img class="check-icon" src="./images/Group 1.svg" alt="Check">
                </div>

                <input class="goal-input" type="text" placeholder="Add a New Goal">
            </div>

            <p class="quote">
                "Move one step ahead today!"
            </p>

            <button class="reset-btn">
                Reset Goals
            </button>

        </div>

    </div>

</body>

</html>
